[package]
license = "MIT"
rust-version = "1.99"
name = "resume-core"
version = "1.0.0"
edition = "2024"

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sha2.workspace = true
tempfile.workspace = true
